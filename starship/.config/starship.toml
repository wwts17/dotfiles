# Verbatim output of `starship preset nerd-font-symbols`.
# Regenerate the preset block via:
#   starship preset nerd-font-symbols -o ~/.config/starship.toml
#
# Starship reads ONE file (no include/merge mechanism). Put personal overrides
# INLINE above this header so diffs against future preset regenerations stay
# obvious. To use a different file entirely, set STARSHIP_CONFIG=<path>.

"$schema" = 'https://starship.rs/config-schema.json'

[aws]
symbol = " "

[azure]
symbol = " "

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

